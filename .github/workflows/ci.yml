name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Testes (unitários, E2E, contrato, arquitetura) com cobertura
        run: npm test
      - name: Arquitetura (dependency-cruiser)
        run: npm run test:arch
      - run: npm run build
      - name: Docker build
        run: docker build -t open-prontuario-bff:${{ github.sha }} .
